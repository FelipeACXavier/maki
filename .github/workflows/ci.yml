name: CI

# Ensure only one run per PR/ref; newer pushes cancel older runs
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  # Build/test on PRs to master
  pull_request:
    branches: [ master ]
  # Also on direct pushes to master
  push:
    branches: [ "**" ]

jobs:
  # ====================================================================================
  # 1) Build the linux version
  build-linux:
    # Self-hosted Linux box
    runs-on: self-hosted

    # Run inside the dev Docker image (standardised env)
    container:
      image: ghcr.io/felipeacxavier/maki/dev:${{ vars.QT_DEV_TAG }}

    env:
      HOME: /home/ubuntu

    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}

    steps:
      # 1) Checkout code
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Symlink repo to $HOME/maki for scripts
        run: |
          mkdir -p "$HOME"
          ln -s "$GITHUB_WORKSPACE" "$HOME/maki" || true

      # 2) Build for given target
      - name: Build script Linux
        run: |
          chmod +x ./scripts/linux/build.sh
          ./scripts/linux/build.sh

      # 3) Run tests for given target (optional)
      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/linux/debug

  # ====================================================================================
