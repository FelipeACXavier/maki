name: Release

# Create release on tag creation, but only if it follows a specific pattern
on:
  push:
    tags:
      # Stable releases: v1.2.3
      - 'v[0-9]+.[0-9]+.[0-9]+'
      # Pre-releases: v1.2.3-rc1, v1.2.3-beta, etc.
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  # ==========================================================================================
  # 1) Build Linux artifacts + Windows SDK inside the dev image
  build-linux:
    name: Build Linux
    runs-on: self-hosted
    container:
      image: ghcr.io/felipeacxavier/maki/dev:${{ vars.QT_DEV_TAG }}

    env:
      HOME: /home/ubuntu

    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Symlink repo to $HOME/maki for scripts
        run: |
          mkdir -p "$HOME"
          ln -s "$GITHUB_WORKSPACE" "$HOME/maki" || true

      # --------------------------------------------------------------------------------------
      # Create the package
      - name: Build Linux
        run: |
          chmod +x scripts/linux/release.sh
          ./scripts/linux/release.sh

      # --------------------------------------------------------------------------------------
      # Upload artifact for next job
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: release/maki-linux.tar.gz

  # ==========================================================================================
  # 2) Create a windows release
  # build-windows:
  #   name: Build Windows
  #   runs-on: windows-latest
  #   defaults:
  #     run:
  #       shell: pwsh
  #       working-directory: ${{ github.workspace }}

  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v4
  #       with:
  #         submodules: recursive
  #         fetch-depth: 1

  #     # --------------------------------------------------------------------------------------
  #     # Create the package
  #     - name: Set up Windows
  #       run: |
  #         ./scripts/windows/setup.ps1

  #     - name: Build Windows
  #       run: |
  #         ./scripts/windows/release.ps1

  #     # --------------------------------------------------------------------------------------
  #     # Upload artifact for next job
  #     - name: Upload Windows artifact
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: windows-release
  #         path: release/maki-windows.zip

  # ==========================================================================================
  # 3) Publish GitHub Release
  release:
    name: Create GitHub Linux Release
    # needs: [build-linux, build-windows]
    needs: [build-linux]
    runs-on: self-hosted

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: ./release

      # - name: Download Windows artifact
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: windows-release
      #     path: ./release
      # Move this below ./release/maki-windows.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./release/maki-linux.tar.gz
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
